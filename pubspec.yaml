name: matchmaker_app
description: "Sallaamti Nikah Counselor — client management, matchmaking desk, and commissions, on the go."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  share_plus: ^12.0.0
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/icon.png

# flutter_launcher_icons config — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  # --mm-plum-dark from the web matchmaker panel's own brand palette —
  # stays in the counselor identity, visually distinct from the member
  # app's dark green on a device's home screen.
  adaptive_icon_background: "#831843"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#831843"

# flutter_native_splash config — run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#831843"
  image: assets/icon.png
  android_12:
    color: "#831843"
    image: assets/icon.png
  android: true
  ios: true
